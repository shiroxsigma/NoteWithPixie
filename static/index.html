<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoteWithPixie</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">🧚 NoteWithPixie</div>
    <div class="file-info">
      <span id="current-file">（ファイル未選択）</span>
      <button id="save-btn" title="保存 (Ctrl+S)">保存</button>
      <span id="save-state"></span>
    </div>
    <div class="model-info">model: <span id="model-name">…</span></div>
  </header>

  <main id="split">
    <!-- 左：執筆エディタ -->
    <section id="left-pane">
      <div id="editor"></div>

      <!-- 差分プレビュー（反映前の確認）。左=現在 / 右=提案（右は編集可）。 -->
      <div id="diff-overlay" class="hidden">
        <div id="diff-bar">
          <span id="diff-label">差分プレビュー：左＝現在 ／ 右＝提案（右は編集して調整可）</span>
          <span class="spacer"></span>
          <button id="diff-apply" class="apply-btn">✓ 適用</button>
          <button id="diff-cancel">キャンセル</button>
        </div>
        <div id="diff-editor"></div>
      </div>

      <div id="left-toolbar">
        <button id="note-btn" title="選択行に付箋を貼る">📌 付箋</button>
        <span id="sel-info" class="hint">テキストを選択してAIに送れます</span>
      </div>
    </section>

    <div id="divider" title="ドラッグで幅を調整"></div>

    <!-- 右：コンテキスト & チャット -->
    <section id="right-pane">
      <div id="filemgr">
        <div class="section-head">
          <span>ファイル（コンテキスト）</span>
          <span class="fm-actions">
            <button id="new-file-btn" title="新規ファイル">📄+</button>
            <button id="new-folder-btn" title="新規フォルダ">📁+</button>
            <button id="web2md-btn" title="URLのページをMarkdown化して web/ に保存する">🌐+</button>
          </span>
          <input id="file-search" type="search" placeholder="🔍 全文検索…" />
        </div>
        <div id="root-bar">
          <button id="root-btn" title="ノートの保存先フォルダを変更（OneDrive など）">📂</button>
          <span id="root-path" title=""></span>
        </div>
        <ul id="file-list"></ul>
        <div id="search-results" class="hidden"></div>
      </div>

      <div id="chat">
        <div id="messages"></div>
        <div id="composer">
          <div id="chip-bar">
            <span id="sel-chip" class="chip hidden">選択テキスト添付</span>
          </div>
          <textarea id="chat-input" rows="3"
            placeholder="例）左の選択部分を、チェックした資料を参考にもう少し技術的な表現に。／先頭に /copilot と書くと Copilot に直接質問します。"></textarea>
          <div class="composer-actions">
            <span class="hint">Ctrl+Enter で送信</span>
            <button id="send-btn">送信</button>
          </div>
          <div id="copilot-bar">
            <button id="copilot-open-btn" title="デバッグ用ブラウザで Copilot を開く（そこで人が対話する）">🕊️ Copilot を開く</button>
            <button id="copilot-import-btn" title="開いている Copilot の会話を取得してAIにまとめさせる（普段のブラウザでOK・Copilotタブを前面にしておく）">⬇ 会話を取り込んでまとめる</button>
            <span id="copilot-status" class="hint"></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- 保存先フォルダ選択ダイアログ -->
  <div id="root-modal" class="hidden">
    <div id="root-dialog">
      <div class="root-head">📂 ノートの保存先フォルダ</div>
      <div id="root-drives"></div>
      <input id="root-input" type="text" spellcheck="false"
        placeholder="例: C:\Users\you\OneDrive - Honda\NoteWithPixie（Enter で移動）" />
      <ul id="root-dirlist"></ul>
      <div class="root-hint hint">フォルダをクリックで移動 ／ パスを直接入力して Enter でも移動できます。存在しないフォルダは決定時に作成されます。</div>
      <div class="root-actions">
        <button id="root-cancel">キャンセル</button>
        <button id="root-ok" class="apply-btn">✓ このフォルダにする</button>
      </div>
    </div>
  </div>

  <!-- Monaco ローダ（ローカルにベンダリングした vs を優先、無ければCDN） -->
  <script>
    window.__MONACO_VS__ = "/static/vendor/monaco/min/vs";
  </script>
  <script src="/static/js/monaco-loader.js"></script>
  <script src="/static/js/app.js" type="module"></script>
</body>
</html>
